name: Bug report
description: Report a reproducible Tailpoint Mobile defect
title: '[Bug]: '
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Do not include passwords, tokens, private task content, or customer data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and platform
    validations:
      required: true
